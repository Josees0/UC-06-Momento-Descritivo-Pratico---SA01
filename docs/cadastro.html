<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <title>Cadastro/Login</title>
</head>
<body>
    <div class="container" style="max-width: 480px; margin-top: 40px;">

        <form action="login.php" method="POST" class="row g-3">
            <h1>Registro</h1>
            <p>Preencha esse formulário para criar uma conta</p>
            <hr>

            <div class="col-12">
              <label for="inputEmail4" class="form-label">Email</label>
              <input type="email" class="form-control" id="inputEmail4" placeholder="Digite o Email" name="email" required>
            </div>

            <div class="col-md-6">
              <label for="inputPassword4" class="form-label">Senha</label>
              <input type="password" class="form-control" id="inputPassword4" placeholder="Digite a senha" name="password" required>
            </div>

            <div class="col-md-6">
                <label for="pswRepeat" class="form-label">Repita a senha</label>
                <input type="password" class="form-control" id="pswRepeat" placeholder="Digite a senha novamente" name="psw-repeat" required>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100">Registre-se</button>
            </div>
        </form>
        <div class="d-flex align-items-center my-4">
            <hr class="flex-grow-1">
            <span class="mx-3 text-muted">ou</span>
            <hr class="flex-grow-1">
        </div>
        <div class="d-flex justify-content-center">
            <div id="g_id_onload"
                 data-client_id="SEU_CLIENT_ID.apps.googleusercontent.com"
                 data-context="signup"
                 data-ux_mode="popup"
                 data-login_uri="https://seusite.com/google-login.php"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signup_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>

        <div class="container signin text-center mt-3">
            <p>Já tem uma conta? <a href="login.html">Logar-se</a>.</p>
        </div>

    </div>
</body>
</html>
